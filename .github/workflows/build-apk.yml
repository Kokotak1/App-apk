name: Build Watch Face APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-apk.yml"
      - "watchface/**"
      - "tools/**"
      - "*.gradle.kts"
      - "gradle.properties"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test service dates
        run: python tools/test_countdown.py
      - name: Generate watch-face bitmaps
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python tools/make_assets.py
      - uses: android-actions/setup-android@v3
      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Compile debug APK
        run: gradle --no-daemon :watchface:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: you-are-free-debug-apk
          path: watchface/build/outputs/apk/debug/*.apk
          if-no-files-found: error
