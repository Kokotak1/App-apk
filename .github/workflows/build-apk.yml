name: Build Pip-Boy Watch Face APK

on:
  workflow_dispatch:
  push:
    branches: [pipboy-red-aod]
    paths:
      - ".github/workflows/build-apk.yml"
      - "watchface/**"
      - "countdown/**"
      - "tools/**"
      - "*.gradle.kts"
      - "gradle.properties"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test four-day service cycle
        run: python tools/test_countdown.py
      - name: Generate image resources
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python tools/make_assets.py
      - name: Validate watch face XML
        run: |
          curl -fL --retry 3 --output /tmp/wff-validator.jar https://github.com/google/watchface/releases/download/release/wff-validator.jar
          java -jar /tmp/wff-validator.jar 1 watchface/src/main/res/raw/watchface.xml
      - name: Install Android 36 SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Compile watch face and hourly countdown companion APKs
        run: gradle --no-daemon :watchface:assembleDebug :countdown:assembleDebug
      - name: Check both APKs were generated
        run: |
          test -f watchface/build/outputs/apk/debug/watchface-debug.apk
          test -f countdown/build/outputs/apk/debug/countdown-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pipboy-red-v1.6-two-apks-install-both
          path: |
            watchface/build/outputs/apk/debug/watchface-debug.apk
            countdown/build/outputs/apk/debug/countdown-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pipboy-red-v1.6-watch-face-only
          path: watchface/build/outputs/apk/debug/watchface-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pipboy-hourly-countdown-app-only
          path: countdown/build/outputs/apk/debug/countdown-debug.apk
          if-no-files-found: error
